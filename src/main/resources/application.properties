spring.application.name=CareS

# Cau hinh server
server.port=${PORT:8080}
server.address=0.0.0.0

# Cau hinh database - dung bien moi truong de ho tro Neon / moi truong deploy
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cau hinh JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.timezone.storage=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.query.fail_on_pagination_underfetch=true

# Cau hinh Security JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# Redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# File upload configuration - kich thuoc toi da 50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.root=${UPLOAD_ROOT:uploads}

app.sms.provider=mock
app.otp.expose-code=${APP_OTP_EXPOSE_CODE:false}
app.otp.cooldown-seconds=${APP_OTP_COOLDOWN_SECONDS:60}
app.otp.max-sends-per-hour=${APP_OTP_MAX_SENDS_PER_HOUR:5}
app.otp.max-verify-attempts=${APP_OTP_MAX_VERIFY_ATTEMPTS:5}

# Comma-separated origins. Khong dung wildcard khi allow-credentials=true.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://front-end-management-system-for-med.vercel.app}

# The doctor-examination frontend round-trips full medical-record DTOs and injects extra
# fields (e.g. status:'draft'); tolerate unknown JSON properties instead of 400-ing.
spring.jackson.deserialization.fail-on-unknown-properties=false

# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
