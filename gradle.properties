org.gradle.daemon=false
org.gradle.jvmargs=-Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m --add-opens java.prefs/java.util.prefs=ALL-UNNAMED
# The Windows AF_UNIX provider on this workstation cannot create the pipe used
# by a forked Gradle daemon. Running without the instrumentation agent lets the
# wrapper JVM satisfy the build requirements and avoids that extra process.
org.gradle.internal.instrumentation.agent=false
